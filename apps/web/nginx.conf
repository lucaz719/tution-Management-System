server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never pin the SPA entry document. Each deployment may reference a new set
  # of content-hashed chunks, so browsers must revalidate this file.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Content-hashed assets are safe to retain. Missing assets must return 404
  # instead of the HTML fallback so the router can show its update recovery UI.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}

