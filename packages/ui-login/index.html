<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #fbf8ff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Header: Shared Component Pattern - TopAppBar (Transactional Suppression Rule Applied) -->
<header class="w-full h-16 flex items-center justify-between px-margin-mobile bg-surface">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-primary text-h3" data-icon="school">school</span>
<span class="font-h3 text-h3 font-bold text-primary">TMS</span>
</div>
<div class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="help_outline">help_outline</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-margin-mobile mt-xl flex-grow flex flex-col">
<!-- Hero Visual (Subtle Pattern) -->
<div class="w-full h-32 mb-lg rounded-xl overflow-hidden relative">
<img alt="Modern educational environment" class="w-full h-full object-cover opacity-80" data-alt="A brightly lit, modern university library hallway with clean architectural lines and minimalist furniture. The color palette is dominated by soft whites and cool indigos, perfectly reflecting a high-end light-mode user interface. The atmosphere is professional, quiet, and intellectually inspiring, with soft natural light filtering through large windows onto polished floors." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOGzG4yVVy8v4qexZD4Dat8MlbUHYznbDw9uX1_uhDyU18uHZsa_uxTeYSzp2PKcUKzJb2b89momlu1tbUZq9dOTibXxNXuIieFCLSNenD11P_aSS5_iluLsGAjitYxaN4uGCe6zCv7P-f9yjupkSSr2X-V_EBe3Vd_Ew7qd0nmockQVi2cSPCk05j5vGaajRH7RlHwJZxxJHt8Jb8xFBELWvr8IfVjFrco79EFBzfE-4yKbxUppk_MqENwExeE1WKiEzSMCarTNw"/>
<div class="absolute inset-0 bg-gradient-to-t from-background to-transparent"></div>
</div>
<!-- Title Section -->
<div class="mb-xl">
<h1 class="font-h1-mobile text-h1-mobile text-on-background mb-xs">Sign In</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access the platform</p>
</div>
<!-- Form Section -->
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-xs" for="email">Email Address</label>
<div class="relative group">
<input class="w-full h-14 px-md rounded-xl border border-outline-variant bg-surface-container-low focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-lg text-body-lg" id="email" placeholder="you@example.com" type="email"/>
<span class="absolute right-4 top-4 material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-xs" for="password">Password</label>
<div class="relative group">
<input class="w-full h-14 px-md rounded-xl border border-outline-variant bg-surface-container-low focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-lg text-body-lg" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-4 text-outline active:scale-95 transition-transform" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
<div class="flex justify-end mt-xs">
<a class="font-label-md text-label-md text-primary font-bold hover:underline" href="#">Forgot Password?</a>
</div>
</div>
<!-- Login Button -->
<button class="w-full h-14 mt- base bg-primary text-on-primary rounded-full font-label-md text-[14px] font-bold tracking-wider uppercase shadow-sm active:scale-95 transition-all flex items-center justify-center gap-base" type="submit">
                SIGN IN
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Biometric Section -->
<div class="mt-xl flex flex-col items-center gap-md py-lg">
<div class="flex items-center gap-base w-full">
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">or</span>
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
</div>
<button class="flex flex-col items-center gap-xs text-on-surface-variant hover:text-primary transition-colors group">
<div class="w-16 h-16 rounded-full border border-outline-variant flex items-center justify-center group-active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[40px]" data-icon="fingerprint">fingerprint</span>
</div>
<p class="font-label-md text-label-md">Use biometric login if enabled</p>
</button>
</div>
</main>
<!-- Success Message (Toast - Hidden) -->
<div class="fixed bottom-margin-mobile left-margin-mobile right-margin-mobile bg-inverse-surface text-inverse-on-surface p-md rounded-lg flex items-center gap-md transform translate-y-32 transition-transform duration-300 z-[100]" id="success-toast">
<span class="material-symbols-outlined text-secondary-fixed" data-icon="check_circle">check_circle</span>
<p class="font-body-md text-body-md">Login attempt recognized. Loading dashboard...</p>
</div>
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Add a micro-interaction to the sign in button
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', () => {
            const toast = document.getElementById('success-toast');
            toast.style.transform = 'translateY(0)';
            setTimeout(() => {
                toast.style.transform = 'translateY(200%)';
            }, 3000);
        });

        // Atmospheric effect: Subtle movement on the hero image
        window.addEventListener('mousemove', (e) => {
            const img = document.querySelector('img');
            const x = (window.innerWidth / 2 - e.pageX) / 100;
            const y = (window.innerHeight / 2 - e.pageY) / 100;
            img.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
