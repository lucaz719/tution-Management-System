name: TMS CI

on:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  pull_request:
    branches: [main, staging]

jobs:
  validate:
    name: Build, lint, schema, and authorization checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Web lint
        run: npm run lint --workspace=web

      - name: Shared types build
        run: npm run build --workspace=@tms/types

      - name: Prisma client generation
        run: npx prisma generate --schema services/api/prisma/schema.prisma

      - name: Web build
        env:
          TMS_API_BASE_URL: https://api.example.test/api
        run: npm run build --workspace=web

      - name: Reject localhost API URLs in production web bundle
        shell: bash
        run: '! grep -R "http://localhost:3001" apps/web/dist'

      - name: API build
        run: npm run build --workspace=@tms/api

      - name: Prisma schema validation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tms?schema=public
        run: npx prisma validate --schema services/api/prisma/schema.prisma

      - name: Authorization scope tests
        run: npm run test:access --workspace=@tms/api

      - name: Academic calendar access tests
        run: npm run test:calendar --workspace=@tms/api

      - name: API unit and configuration tests
        run: |
          npm run test:runtime-config --workspace=@tms/api
          npm run test:request-validation --workspace=@tms/api
          npm run test:billing --workspace=@tms/api
          npm run test:connectips --workspace=@tms/api
          npm run test:connectips-reconciliation --workspace=@tms/api

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Secret and fixed-identifier scan
        shell: bash
        run: |
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='test-*.ts' --exclude='smoke.js' \
            -e 'TMSWelcome[0-9]' -e 'PinnacleAdmin' -e 'BaneshworAdmin' \
            -e 'b-baneshwor-01' -e 'janitor-staff-user-300' \
            apps services packages

      - name: Validate production Compose model
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
          BETTER_AUTH_URL: https://api.example.test
          WEB_ORIGIN: https://app.example.test
          NEPALPAY_WEBHOOK_SECRET: ci-only-nepalpay-secret-at-least-32-characters
          TMS_API_BASE_URL: https://api.example.test/api
          SMS_PROVIDER: DISABLED
        run: docker compose -f compose.yml config --quiet

      - name: Build production API image
        run: docker build --file services/api/Dockerfile --tag tms-api:${{ github.sha }} .

      - name: Build production web image
        run: docker build --file apps/web/Dockerfile --build-arg TMS_API_BASE_URL=https://api.example.test/api --tag tms-web:${{ github.sha }} .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: dist-${{ github.sha }}
          path: apps/web/dist/
          retention-days: 7
